name: Ingest gallery uploads

on:
  push:
    branches: [main]
    paths:
      - "docs/input_material/**"
      - "gallery/**"
      - "auto_update.py"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gallery-ingest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CJK font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Ingest uploads and rebuild the public site
        run: python -m gallery ingest

      - name: Commit generated gallery changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- docs
          git diff --cached --quiet || git commit -m "Auto update gallery from input_material"
          git push
