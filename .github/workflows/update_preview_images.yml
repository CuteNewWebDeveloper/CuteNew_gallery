name: Crop existing preview images

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gallery-preview-crop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  crop-previews:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Crop previews to 16:10
        run: python -m gallery crop-previews

      - name: Commit changed previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- docs/images_preview
          git diff --cached --quiet || git commit -m "Crop gallery preview images"
          git push
