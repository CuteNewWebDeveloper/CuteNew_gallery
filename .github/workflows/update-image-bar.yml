name: Refresh gallery watermark bars

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gallery-watermark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  watermark:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CJK font and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --requirement requirements.txt

      - name: Rebuild watermark bars from image_log.csv
        run: python -m gallery watermark

      - name: Commit changed full-size images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- docs/images
          git diff --cached --quiet || git commit -m "Refresh gallery watermark bars"
          git push
