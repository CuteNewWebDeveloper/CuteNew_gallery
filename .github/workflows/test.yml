name: Test gallery pipeline

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "gallery/**"
      - "tests/**"
      - "requirements.txt"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            gallery
            tests
            requirements.txt
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install --requirement requirements.txt
      - run: python -m unittest discover -s tests -v
