<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="按拍摄日期浏览 CuteNew Gallery 航空摄影作品">
  <meta name="theme-color" content="#122445">
  <title>按日期浏览 · CuteNew Gallery</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="assets/site.css">
  <script src="assets/site.js" defer></script>
</head>
<body>
<a class="skip-link" href="#main-content">跳到主要内容</a>
<header class="site-header" data-site-header>
  <div class="site-header__inner">
    <a class="site-title" href="index.html" aria-label="CuteNew Gallery 首页">
      <span class="site-title__primary">CuteNew</span>
      <span class="site-title__secondary">Gallery</span>
    </a>
    <nav class="site-nav" aria-label="主导航">
      <a href="index.html"><span class="site-nav__index" aria-hidden="true">01</span><span>首页</span></a>
      <a href="browse_from_date.html" aria-current="page"><span class="site-nav__index" aria-hidden="true">02</span><span>按日期</span></a>
      <a href="browse_from_airport.html"><span class="site-nav__index" aria-hidden="true">03</span><span>按机场</span></a>
    </nav>
    <img class="site-logo" src="assets/brand-watermark.png" alt="CuteNew 航空摄影小组" decoding="async" draggable="false">
  </div>
  <div class="scroll-progress" aria-hidden="true"><span data-scroll-progress></span></div>
</header>

<main id="main-content" class="index-main">
  <section class="index-hero" data-reveal>
    <div>
      <p class="index-hero__kicker">Timeline / Flight frames</p>
      <h1>日期<br>索引</h1>
    </div>
    <div class="index-hero__aside">
      <p>沿时间轴浏览影像。颜色越深，代表当天收录的作品越多；选择有影像的日期即可进入对应集合。</p>
      <div class="index-hero__meta"><span>Date archive</span><span id="dateRange">Loading</span></div>
    </div>
  </section>

  <section class="calendar" aria-label="图库日期日历" data-reveal>
    <div class="calendar-header">
      <button id="prevYear" class="brand-action" type="button" aria-label="上一年"><span class="action-label">« 年</span></button>
      <button id="prevMonth" class="brand-action" type="button" aria-label="上个月"><span class="action-label">« 月</span></button>
      <span id="monthYear" aria-live="polite"></span>
      <button id="nextMonth" class="brand-action" type="button" aria-label="下个月"><span class="action-label">月 »</span></button>
      <button id="nextYear" class="brand-action" type="button" aria-label="下一年"><span class="action-label">年 »</span></button>
    </div>
    <table>
      <thead><tr><th scope="col">日</th><th scope="col">一</th><th scope="col">二</th><th scope="col">三</th><th scope="col">四</th><th scope="col">五</th><th scope="col">六</th></tr></thead>
      <tbody id="calendar-body"></tbody>
    </table>
  </section>
</main>

<script>
  let currentYear;
  let currentMonth;
  const dateData = {};

  document.addEventListener('DOMContentLoaded', async () => {
    const today = new Date();
    currentYear = today.getFullYear();
    currentMonth = today.getMonth();

    await loadCSV('./datedata.csv');
    const availableDates = Object.keys(dateData).sort();
    if (availableDates.length) {
      const latest = new Date(`${availableDates.at(-1)}T12:00:00`);
      currentYear = latest.getFullYear();
      currentMonth = latest.getMonth();
      document.getElementById('dateRange').textContent = `${availableDates[0]} — ${availableDates.at(-1)}`;
    } else {
      document.getElementById('dateRange').textContent = 'No frames';
    }
    renderCalendar(currentYear, currentMonth);

    document.getElementById('prevMonth').addEventListener('click', () => changeMonth(-1));
    document.getElementById('nextMonth').addEventListener('click', () => changeMonth(1));
    document.getElementById('prevYear').addEventListener('click', () => changeYear(-1));
    document.getElementById('nextYear').addEventListener('click', () => changeYear(1));
  });

  function changeMonth(offset) {
    currentMonth += offset;
    if (currentMonth < 0) {
      currentMonth = 11;
      currentYear -= 1;
    } else if (currentMonth > 11) {
      currentMonth = 0;
      currentYear += 1;
    }
    renderCalendar(currentYear, currentMonth);
  }

  function changeYear(offset) {
    currentYear += offset;
    renderCalendar(currentYear, currentMonth);
  }

  async function loadCSV(url) {
    try {
      const response = await fetch(url);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const lines = (await response.text()).trim().split(/\r?\n/).slice(1);
      lines.forEach((line) => {
        const [date, count] = line.split(',');
        if (date) dateData[date] = Number.parseInt(count, 10) || 0;
      });
    } catch (error) {
      console.error('日期数据读取失败:', error);
      document.getElementById('dateRange').textContent = 'Unavailable';
    }
  }

  function renderCalendar(year, month) {
    document.getElementById('monthYear').textContent = `${year}年 ${month + 1}月`;
    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const previousMonthDays = new Date(year, month, 0).getDate();
    let day = 1;
    let nextMonthDay = 1;
    let html = '';

    for (let rowIndex = 0; rowIndex < 6; rowIndex += 1) {
      let row = '<tr>';
      for (let columnIndex = 0; columnIndex < 7; columnIndex += 1) {
        let cellDate;
        let isCurrentMonth = true;
        if (rowIndex === 0 && columnIndex < firstDay) {
          cellDate = new Date(year, month - 1, previousMonthDays - firstDay + columnIndex + 1);
          isCurrentMonth = false;
        } else if (day > daysInMonth) {
          cellDate = new Date(year, month + 1, nextMonthDay);
          nextMonthDay += 1;
          isCurrentMonth = false;
        } else {
          cellDate = new Date(year, month, day);
          day += 1;
        }

        const dateString = `${cellDate.getFullYear()}-${String(cellDate.getMonth() + 1).padStart(2, '0')}-${String(cellDate.getDate()).padStart(2, '0')}`;
        const count = isCurrentMonth ? dateData[dateString] || 0 : 0;
        const available = isCurrentMonth && count > 0;
        const factor = available ? Math.min(.18 + (count / 10) * .82, 1) : 0;
        const background = available ? gradientColor('#dce7f3', '#122445', factor) : '#eef1f4';
        const color = available && factor > .48 ? '#ffffff' : '#071328';
        const disabledClass = available ? '' : 'disabled';
        const content = available
          ? `<button class="calendar-day" type="button" onclick="goToDate('${dateString}')" aria-label="查看 ${dateString} 的 ${count} 张照片"><span class="calendar-day__date">${cellDate.getDate()}</span><span class="calendar-day__count">${count} frames</span></button>`
          : `<div class="calendar-day--disabled" aria-hidden="true"><span class="calendar-day__date">${cellDate.getDate()}</span><span class="calendar-day__count">—</span></div>`;
        row += `<td class="${disabledClass}" style="background:${background};color:${color}">${content}</td>`;
      }
      html += `${row}</tr>`;
    }
    document.getElementById('calendar-body').innerHTML = html;
  }

  function gradientColor(startColor, endColor, factor) {
    const start = hexToRgb(startColor);
    const end = hexToRgb(endColor);
    const value = (channel) => Math.round(start[channel] + factor * (end[channel] - start[channel]));
    return `rgb(${value('r')},${value('g')},${value('b')})`;
  }

  function hexToRgb(hex) {
    const value = Number.parseInt(hex.replace('#', ''), 16);
    return { r: (value >> 16) & 255, g: (value >> 8) & 255, b: value & 255 };
  }

  function goToDate(dateString) {
    window.location.href = `photos.html?date=${encodeURIComponent(dateString)}`;
  }
</script>
</body>
</html>
