<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CuteNew Gallery</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="assets/site.css">
  <script src="assets/site.js" defer></script>

  <style>
    .airport-browser__main { max-width: 68rem; }
    .letter-section { margin: 1.75rem auto; }
    .letter-section h2 { margin: 0; border-bottom: 2px solid var(--brand); padding-bottom: .35rem; color: var(--brand); font-size: 1.55rem; }
    .airport-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(9rem, 1fr)); gap: .75rem; margin-top: .85rem; }
    .airport-item { min-width: 0; border: 1px solid var(--line); border-radius: .45rem; padding: .65rem; background: var(--surface); text-align: center; }
    .airport-link { display: block; width: 100%; text-decoration: none; }
    .airport-desc { margin-top: .5rem; color: var(--muted); font-size: .8rem; line-height: 1.25; overflow-wrap: anywhere; }
  </style>
</head>
<body>

<header class="site-header">
  <div class="site-header__inner">
    <a class="site-title" href="index.html">CuteNew Gallery</a>
    <nav class="site-nav" aria-label="主导航">
      <a href="index.html">首页</a>
      <a href="browse_from_date.html">按日期</a>
      <a href="browse_from_airport.html" aria-current="page">按机场</a>
    </nav>
    <img class="site-logo" src="assets/brand-watermark.png" alt="CuteNew Gallery">
  </div>
</header>

<main class="airport-browser__main">
  <div id="container"></div>
</main>

<script>
  // 从 CSV 读取并解析
  async function loadAirportData() {
    const response = await fetch('./airportdata.csv');
    const text = await response.text();
    const lines = text.trim().split('\n').slice(1); // 去掉表头
    const airports = [];

    for (let line of lines) {
      const [code, description] = line.split(',');
      if (code) {
        airports.push({
          code: code.trim().toUpperCase(),
          description: (description || '').trim(),
          url: `photos.html?location=${encodeURIComponent(code.trim().toUpperCase())}`
        });
      }
    }
    return airports;
  }

  function renderAirports(airports) {
    // 按字母排序
    airports.sort((a, b) => a.code.localeCompare(b.code));

    // 按首字母分组
    const grouped = {};
    airports.forEach(ap => {
      const letter = ap.code[0];
      if (!grouped[letter]) grouped[letter] = [];
      grouped[letter].push(ap);
    });

    // 渲染到页面
    const container = document.getElementById("container");
    container.innerHTML = ''; // 清空
    Object.keys(grouped).sort().forEach(letter => {
      const section = document.createElement("div");
      section.className = "letter-section";
      section.innerHTML = `<h2>${letter}</h2>`;

      const grid = document.createElement("div");
      grid.className = "airport-grid";

      grouped[letter].forEach(ap => {
        const item = document.createElement("div");
        item.className = "airport-item";

        const link = document.createElement("a");
        link.className = "brand-action airport-link";
        link.href = ap.url;
        link.target = "_blank";
        link.rel = "noopener";
        const label = document.createElement("span");
        label.className = "action-label";
        label.textContent = ap.code;
        link.appendChild(label);

        item.appendChild(link);

        if (ap.description) {
          const desc = document.createElement("div");
          desc.className = "airport-desc";
          desc.textContent = ap.description;
          item.appendChild(desc);
        }

        grid.appendChild(item);
      });

      section.appendChild(grid);
      container.appendChild(section);
    });
  }

  // 页面加载时执行
  loadAirportData().then(renderAirports);
</script>

</body>
</html>
